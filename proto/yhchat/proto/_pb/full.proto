syntax = "proto3";

// 云湖 v1 接口的 protobuf 消息子集。
//
// 字段名与字段号是 wire 协议事实，取自 yhchatAPI 文档站附带的 full.proto；
// 该文档仓库是 GPLv3，这里只按字段号重写需要的最小子集，不复制其文本与注释。
// `package yh` 与线上一致，改包名会影响兼容性。
package yh;

// 会话类型
enum ChatType {
  unknown1 = 0;
  user = 1;
  group = 2;
  bot = 3;
}

// 内容类型
enum ContentType {
  unknown2 = 0;
  text = 1;
  image = 2;
  markdown = 3;
  file = 4;
  form = 5;
  sticker = 7;
  html = 8;
  tip = 9;
  audio = 11;
  call = 13;
  a2ui = 14;
}

enum VipStatus {
  VIP_STATUS_NONE = 0;
  VIP_STATUS_ACTIVE = 1;
  VIP_STATUS_EXPIRED = 2;
}

message Empty {}

message Status {
  int64 request_id = 1;
  int32 code = 2;
  string msg = 3;
}

message StatusResponse {
  Status status = 1;
}

message Tag {
  uint64 id = 1;
  string group_id = 2;
  string text = 3;
  string color = 4;
}

message Sender {
  string chat_id = 1;
  ChatType chat_type = 2;
  string name = 3;
  string avatar_url = 4;
  bool is_vip = 5;
  repeated string tag_old = 6;
  repeated Tag tag = 7;
}

message Cmd {
  uint64 cmd_id = 1;
  string name = 2;
  int32 type = 4;
}

message MsgContent {
  string text = 1;
  string buttons = 2;
  string image_url = 3;
  string file_name = 4;
  string file_url = 5;
  repeated string mentioned_id = 6;
  string form = 7;
  string quote_msg_text = 8;
  string image = 9;
  string post_id = 10;
  string post_title = 11;
  string post_content = 12;
  string post_content_type = 13;
  string expression_id = 15;
  string quote_image_url = 16;
  string quote_image_name = 17;
  int64 file_size = 18;
  string video_url = 19;
  int32 video_time = 20;
  string audio_url = 21;
  int32 audio_time = 22;
  string quote_video_url = 23;
  int32 quote_video_time = 24;
  int64 sticker_item_id = 25;
  int64 sticker_pack_id = 26;
  string room_name = 29;
  string call_status_text = 32;
  int32 width = 33;
  int32 height = 34;
  string tip = 37;
}

// 发送消息；编辑消息复用同一结构（文档明确说明）
message SendMsgRequest {
  string msg_id = 2;
  string chat_id = 3;
  ChatType chat_type = 4;
  MsgContent content = 5;
  ContentType content_type = 6;
  int64 command_id = 7;
  string quote_msg_id = 8;
}

message ListMsgRequest {
  int32 msg_count = 2;
  string msg_id = 3;
  ChatType chat_type = 4;
  string chat_id = 5;
}

message ListMsgBySeqRequest {
  uint64 msg_start = 3;
  ChatType chat_type = 4;
  string chat_id = 5;
}

message ListMsgByMidSeqRequest {
  uint64 msg_seq = 3;
  ChatType chat_type = 4;
  string chat_id = 5;
  uint64 unknown = 6;
  int32 msg_count = 7;
  string msg_id = 8;
}

message PicListMsgByMidSeqRequest {
  uint64 image_id = 3;
  ChatType chat_type = 4;
  string chat_id = 5;
  uint64 earlier_quantities = 6;
  uint64 latest_quantities = 7;
}

message ButtonReportRequest {
  string msg_id = 2;
  ChatType chat_type = 3;
  string chat_id = 4;
  string user_id = 5;
  string button_value = 6;
}

message RecallMsg {
  repeated string msg_id = 2;
  string chat_id = 3;
  ChatType chat_type = 4;
}

message MedalInfo {
  uint64 id = 1;
  string name = 2;
  uint64 sort = 5;
}

message RemarkInfo {
  string remark_name = 1;
  string phone = 2;
  string extra_remark = 3;
}

message ProfileInfo {
  string last_active_time = 1;
  string introduction = 2;
  int32 gender = 3;
  uint64 birthday_timestamp = 4;
  string city = 5;
  string district = 6;
  string address = 7;
}

message GetUserRequest {
  string id = 2;
}

message GetUserResponse {
  Status status = 1;
  Data data = 2;

  message Data {
    string id = 1;
    string name = 2;
    uint64 name_id = 3;
    string avatar_url = 4;
    uint64 avatar_id = 5;
    repeated MedalInfo medal = 6;
    string register_time = 7;
    bool do_not_disturb = 8;
    int64 ban_id = 9;
    int64 ban_until_timestamp = 10;
    int32 online_day = 11;
    int32 continuous_online_day = 12;
    bool is_vip = 13;
    uint64 vip_expired_timestamp = 14;
    VipStatus vip_status = 15;
    bool is_blocked = 16;
    bool top = 17;
    RemarkInfo remark_info = 18;
    ProfileInfo profile_info = 19;
    string ip_geo = 20;
    string ban_reason = 21;
  }
}

message GetSelfMedal {
  Status status = 1;
  repeated MedalInfo medal = 2;
}

message EditNicknameRequest {
  string name = 3;
}

message EditAvatarRequest {
  string url = 2;
}

message ListMsgResponse {
  Status status = 1;
  repeated MsgData data = 2;
  int32 total = 3;

  message MsgData {
    string msg_id = 1;
    Sender sender = 2;
    string direction = 3;
    ContentType content_type = 4;
    MsgContent content = 5;
    uint64 send_timestamp_ms = 6;
    Cmd cmd = 7;
    uint64 recall_timestamp = 8;
    string quote_msg_id = 9;
    uint64 msg_seq = 10;
    uint64 edit_timestamp = 12;
  }
}

message BotData {
  reserved 12;
  string bot_id = 1;
  string name = 2;
  int64 name_id = 3;
  string avatar_url = 4;
  int64 avatar_id = 5;
  string introduction = 6;
  string create_by = 7;
  int64 create_timestamp = 8;
  int64 headcount = 9;
  bool private = 10;
  bool is_stop = 11;
  bool always_agree = 13;
  bool prevent_deletion = 14;
  bool do_not_disturb = 15;
  int64 ban_id = 16;
  int64 ban_until_timestamp = 17;
  bool top = 18;
  bool is_deleted = 19;
  bool group_limit = 20;
  int32 field21 = 21;
  string ban_reason = 22;
}

message GroupData {
  string group_id = 1;
  string name = 2;
  string avatar_url = 3;
  uint64 avatar_id = 4;
  string introduction = 5;
  uint64 headcount = 6;
  string create_by = 7;
  bool direct_join = 8;
  int32 permisson_level = 9;
  bool history_msg = 10;
  string category_name = 11;
  uint64 category_id = 12;
  bool private = 13;
  bool do_not_disturb = 14;
  uint64 community_id = 15;
  string community_name = 16;
  int64 ban_id = 17;
  int64 ban_until_timestamp = 18;
  bool top = 19;
  repeated string admin = 20;
  int64 gag_until_timestamp = 21;
  string limited_msg_type = 22;
  string owner = 23;
  bool recommandation = 24;
  bool is_gag = 25;
  repeated string tag_old = 26;
  repeated Tag tag = 27;
  string my_group_nickname = 28;
  string group_code = 29;
  bool hide_group_members = 30;
  int64 field31 = 31;
  bool auto_delete_message = 32;
  bool deny_members_upload_to_group_disk = 33;
  string ban_reason = 34;
}

message GroupInfoRequest {
  string group_id = 2;
}

message GroupInfoResponse {
  Status status = 1;
  GroupData data = 2;
  repeated BotData bot = 3;
}

message ListMemberRequest {
  Data data = 2;
  message Data {
    int32 size = 1;
    int32 page = 2;
  }
  string group_id = 3;
  string keywords = 4;
}

message ListMemberResponse {
  Status status = 1;
  repeated User user = 2;
  int32 total = 3;

  message User {
    string group_id = 1;
    UserInfo user_info = 2;
    int32 permission_level = 3;
    int64 gag_timestamp = 4;
    bool is_gag = 5;

    message UserInfo {
      string user_id = 1;
      string name = 2;
      string avatar_url = 4;
      bool is_vip = 6;
    }
  }
}

message EditGroupRequest {
  string group_id = 2;
  string name = 3;
  string introduction = 4;
  string avatar_url = 5;
  bool direct_join = 6;
  bool history_msg = 7;
  string category_name = 8;
  uint64 category_id = 9;
  bool private = 10;
  bool hide_group_members = 11;
}

message BotListRequest {
  string group_id = 2;
}

message BotListResponse {
  Status status = 1;
  repeated BotData bot = 2;
  repeated InstructionData instruction = 3;
  repeated MenuData menu = 4;

  message InstructionData {
    int64 id = 1;
    string bot_id = 2;
    string name = 3;
    string desc = 4;
    int32 type = 5;
    string hint_text = 6;
    string default_text = 7;
    int64 sort = 9;
    string form = 10;
    string bot_name = 11;
  }

  message MenuData {
    int64 id = 1;
    string bot_id = 2;
    string name = 4;
    string content = 5;
    int32 menu_type = 6;
    int64 create_timestamp = 7;
    int32 menu_action = 10;
    string select = 99;
  }
}

message InfoAddFriendRequest {
  string keyword = 2;
}

message InfoAddFriendResponse {
  Status status = 1;
  GroupData data = 2;
}

message CreateGroupRequest {
  string name = 2;
  string introduction = 3;
  string avatar_url = 4;
}

message CreateGroupResponse {
  Status status = 1;
  string group_id = 2;
}

message DismissGroupRequest {
  string group_id = 2;
}

message TagMemberRequest {
  Data data = 2;
  message Data {
    int32 size = 1;
    int32 page = 2;
  }
  string group_id = 3;
  int64 tag_id = 4;
}

message GetBotInstructionRequest {
  string bot_id = 3;
}

message GetBotInstructionResponse {
  Status status = 1;
  Data data = 2;

  message Data {
    uint64 command_id = 1;
    string bot_id = 2;
    string command_name = 3;
    int32 instruction_type = 5;
    string command_default_text = 7;
    string command_settings_json = 10;
  }
}
