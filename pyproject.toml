[project]
name = "yhchat-client-sdk"
version = "0.1.0"
description = "云湖（YHChat）非官方 Python SDK"
readme = "README.md"
requires-python = ">=3.12"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "hhhhhge", email = "2173376743@qq.com" }]
dependencies = [
    "httpx[http2]>=0.28",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# HTTP/2 服务端与 Satori 协议端（自研实现）
server = [
    "granian>=2.0",
    "starlette>=0.41",
    "websockets>=13",
]
# gRPC 门面
grpc = [
    "grpcio>=1.70",
    "protobuf>=5.28",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.70",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "yhchat"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "*.md", "src/yhchat/grpc/_pb"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PERF", "TCH", "RET", "PIE", "ASYNC", "LOG", "G", "PYI"]
# ASYNC109 要求用 asyncio.timeout 代替 timeout 参数；gRPC 调用需要原样透传 deadline，这里不适用
ignore = ["E501", "RUF001", "RUF002", "RUF003", "ASYNC109"]

[tool.ruff.lint.pyupgrade]
# 运行时注解也按 py312 现代化（pydantic v2 支持 PEP 604/585）
keep-runtime-typing = false

[tool.ruff.lint.isort]
known-first-party = ["yhchat"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src", "tests", "tools"]
exclude = [".venv", "**/__pycache__", "src/yhchat/grpc/_pb"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
deprecateTypingAliases = true
reportUnnecessaryTypeIgnoreComment = "error"
